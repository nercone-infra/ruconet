global
    user   haproxy
    group  haproxy
    chroot /var/lib/haproxy

    maxconn 4096

    log stderr format raw local0 notice

    ssl-default-bind-options      ssl-min-ver TLSv1.2 ssl-max-ver TLSv1.3 no-tls-tickets
    ssl-default-bind-ciphers      ECDHE-ECDSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256
    ssl-default-bind-curves       X25519MLKEM768:SecP384r1MLKEM1024:SecP256r1MLKEM768:MLKEM1024:MLKEM768:secp384r1:secp256r1
    ssl-default-bind-sigalgs      ecdsa_secp384r1_sha384

    ssl-default-server-options      ssl-min-ver TLSv1.2 ssl-max-ver TLSv1.3 no-tls-tickets
    ssl-default-server-ciphers      ECDHE-ECDSA-AES256-GCM-SHA384
    ssl-default-server-ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256
    ssl-default-server-curves       X25519MLKEM768:SecP384r1MLKEM1024:SecP256r1MLKEM768:MLKEM1024:MLKEM768:secp384r1:secp256r1
    ssl-default-server-sigalgs      ecdsa_secp384r1_sha384

    tune.ssl.lifetime 4h

defaults
    mode tcp
    log  global

    timeout connect 10s
    timeout client  10m
    timeout server  10m

crt-store ruconet
    crt-base /etc/certs/ruconet
    key-base /etc/certs/ruconet

    load crt "cert.pem" key "key.pem" alias "ruconet"
