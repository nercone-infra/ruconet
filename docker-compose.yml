services:
  ruconet:
    container_name: ruconet
    image: ghcr.io/nercone-infra/ruconet-hub:latest
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      - "51820:51820/udp"
    env_file:
      - path: .env
        required: true
    volumes:
      - ./etc:/etc/ruconet:ro
    environment:
      - RUCONET_NAME=ruconet
    healthcheck:
      test: ["CMD", "/usr/local/bin/ruconet-hub", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    enable_ipv6: true
