services:
  ruconet:
    container_name: ruconet
    image: ghcr.io/nercone-infra/ruconet:latest
    command: ["/usr/local/bin/ruconet-hub"]
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv4.conf.all.rp_filter: 2
    dns:
      - 127.0.0.1
    dns_opt:
      - trust-ad
    ports:
      - "51820:51820/udp"
    env_file:
      - path: .env
        required: true
    volumes:
      - ./etc:/etc/ruconet:ro
      - ./hub:/etc/ruconet.d:ro
      - ./data/certs:/etc/certs:ro
    environment:
      - RUCONET_NAME=ruconet
    healthcheck:
      test: ["CMD", "/usr/local/bin/ruconet-hub", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ca:
    container_name: ruconet-ca
    build:
      context: .
      target: ca
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    network_mode: service:ruconet
    volumes:
      - ./etc:/etc/ruconet:ro
      - ./data/ca:/var/lib/ca
      - ./data/certs:/etc/certs
      - ./data/letsencrypt:/etc/letsencrypt:ro
    environment:
      - LETSENCRYPT_NAME=nercone.dev
      - LETSENCRYPT_MEMBERS=gateway mail
    depends_on:
      ruconet:
        condition: service_started
        restart: true

  letsencrypt:
    container_name: ruconet-letsencrypt
    image: certbot/dns-cloudflare:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    network_mode: service:ruconet
    entrypoint: ["/bin/sh", "/usr/local/lib/letsencrypt/entrypoint.sh"]
    volumes:
      - ./letsencrypt:/usr/local/lib/letsencrypt:ro
      - ./data/letsencrypt:/etc/letsencrypt
    environment:
      - LETSENCRYPT_NAME=nercone.dev
      - LETSENCRYPT_DOMAINS=nerc1.dev nercone.dev d-g-c.net diamondgotcat.net *.nerc1.dev *.nercone.dev *.d-g-c.net *.diamondgotcat.net
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}
    depends_on:
      ruconet:
        condition: service_started
        restart: true

networks:
  default:
    enable_ipv6: true
