proxy_ssl_protocols TLSv1.2 TLSv1.3;

proxy_ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384;
proxy_ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384;
proxy_ssl_conf_command Groups X25519MLKEM768:SecP384r1MLKEM1024:SecP256r1MLKEM768:MLKEM1024:MLKEM768:secp384r1:secp256r1;

proxy_ssl_conf_command SignatureAlgorithms ecdsa_secp384r1_sha384;

proxy_ssl_certificate         /etc/certs/ruconet/cert.pem;
proxy_ssl_certificate_key     /etc/certs/ruconet/key.pem;
proxy_ssl_trusted_certificate /etc/certs/ruconet/ca.pem;
proxy_ssl_verify              on;
proxy_ssl_verify_depth        1;
proxy_ssl_server_name         on;
proxy_ssl_session_reuse       on;
