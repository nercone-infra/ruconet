ssl_protocols TLSv1.2 TLSv1.3;

ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384;
ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384;
ssl_ecdh_curve X25519MLKEM768:SecP384r1MLKEM1024:SecP256r1MLKEM768:MLKEM1024:MLKEM768:secp384r1:secp256r1;
ssl_prefer_server_ciphers on;

ssl_conf_command SignatureAlgorithms ecdsa_secp384r1_sha384;

ssl_session_timeout 4h;
ssl_session_tickets off;
