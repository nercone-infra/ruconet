include       /usr/local/share/nginx/mime.types;
default_type  application/octet-stream;

access_log    off;
server_tokens off;

sendfile    on;
tcp_nopush  on;
tcp_nodelay on;

keepalive_timeout 65;

ssl_session_cache shared:RUCONET_HTTP:4m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
